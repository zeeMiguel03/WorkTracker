<div
  class="dropdown"
  [class.dropdown--open]="isOpen()"
  [class.dropdown--full-width]="fullWidth()"
  [class.dropdown--open-up]="openUp()"
>
  <button
    class="dropdown__trigger"
    type="button"
    [id]="triggerId"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="ariaLabel() || null"
    aria-haspopup="listbox"
    (click)="toggle($event)"
  >
    <span class="dropdown__selected-content">
      @if (imageUrl(selectedOption())) {
        <img class="dropdown__avatar" [src]="imageUrl(selectedOption())!" [alt]="''" />
      }
      <span class="dropdown__selected-copy">
        <span>{{ selectedOption()?.label }}</span>
        @if (selectedOption()?.meta) { <small>{{ selectedOption()?.meta }}</small> }
      </span>
    </span>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5" /></svg>
  </button>

  @if (isOpen()) {
    <div class="dropdown__menu" role="listbox" [attr.aria-labelledby]="triggerId">
      @for (option of options(); track option.value) {
        <button
          class="dropdown__option"
          type="button"
          role="option"
          [class.dropdown__option--selected]="option.value === value()"
          [attr.aria-selected]="option.value === value()"
          (click)="choose(option, $event)"
        >
          @if (imageUrl(option)) {
            <img class="dropdown__avatar" [src]="imageUrl(option)!" [alt]="''" />
          }
          <span class="dropdown__option-copy">
            <span>{{ option.label }}</span>
            @if (option.meta) { <small>{{ option.meta }}</small> }
          </span>
        </button>
      }
    </div>
  }
</div>
