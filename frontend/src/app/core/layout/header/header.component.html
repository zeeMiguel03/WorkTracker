<header class="topbar" (click)="closeUserMenu()">
  <div class="topbar__left">
    <button class="icon-button" type="button" aria-label="Toggle sidebar" (click)="sidebar.toggle()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h9M5 17h14"/></svg>
    </button>
  </div>
  <div class="topbar__actions">
    <app-theme-toggle />
    <button class="round-button notification" type="button" aria-label="Notifications">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.75 2.292C10.75 1.878 10.414 1.542 10 1.542s-.75.336-.75.75v.544a6.38 6.38 0 0 0-5.625 6.331v5.292h-.292a.75.75 0 0 0 0 1.5h13.334a.75.75 0 0 0 0-1.5h-.292V9.167a6.38 6.38 0 0 0-5.625-6.331v-.544Zm4.125 12.167V9.167a4.875 4.875 0 0 0-9.75 0v5.292h9.75ZM8 17.708c0 .414.336.75.75.75h2.5a.75.75 0 0 0 0-1.5h-2.5a.75.75 0 0 0-.75.75Z"/></svg>
    </button>
    <div class="user-menu" (click)="$event.stopPropagation()">
      <button class="user-menu__trigger" type="button" aria-label="Abrir menu do utilizador" [attr.aria-expanded]="userMenuOpen()" (click)="toggleUserMenu($event)">
        <span class="avatar">
          <app-authenticated-image [src]="profileImageSource()" [alt]="'Fotografia de ' + (auth.currentUser()?.name ?? 'utilizador')">
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="15" r="8"/><path d="M8 42c1-11 6-17 14-17s13 6 14 17"/></svg>
          </app-authenticated-image>
        </span>
        <span class="user-name">{{ auth.currentUser()?.name ?? 'Utilizador' }}</span>
        <svg class="user-chevron" [class.user-chevron--open]="userMenuOpen()" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.79 7.4 5.21 5.2 5.21-5.2"/></svg>
      </button>
      @if (userMenuOpen()) {
        <div class="user-menu__panel" role="menu">
          <div class="user-menu__identity"><strong>{{ auth.currentUser()?.name ?? 'Utilizador' }}</strong><small>{{ auth.currentUser()?.email ?? '' }}</small></div>
          <div class="user-menu__divider"></div>
          <a class="user-menu__item" routerLink="/profile" role="menuitem" (click)="closeUserMenu()"><span class="user-menu__item-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3"/><path d="M4.5 17c.5-3.1 2.3-4.8 5.5-4.8s5 1.7 5.5 4.8"/></svg></span><span>Ver perfil</span></a>
          <button class="user-menu__item" type="button" role="menuitem" (click)="toggleTheme()"><span class="user-menu__item-icon"><svg viewBox="0 0 20 20" aria-hidden="true">@if (theme.isLight()) { <path d="M14.8 12.8A5.5 5.5 0 0 1 7.2 5.2 5.5 5.5 0 1 0 14.8 12.8Z"/> } @else { <circle cx="10" cy="10" r="3.2"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/> }</svg></span><span>{{ theme.isLight() ? 'Modo escuro' : 'Modo claro' }}</span></button>
          <div class="user-menu__divider"></div>
          <button class="user-menu__item user-menu__item--danger" type="button" role="menuitem" (click)="logout()"><span class="user-menu__item-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3H4.8A1.8 1.8 0 0 0 3 4.8v10.4A1.8 1.8 0 0 0 4.8 17H8M11.5 6.5 15 10l-3.5 3.5M15 10H7"/></svg></span><span>Terminar sessão</span></button>
        </div>
      }
    </div>
  </div>
</header>
