<aside class="sidebar" [class.sidebar--collapsed]="!sidebar.expanded()" [class.sidebar--mobile-open]="sidebar.mobileOpen()">
  <div class="sidebar__logo">
    <span class="sidebar__logo-mark"><img src="/images/logo/auth-logo.svg" alt="" width="154" height="32" /></span>
    <span class="sidebar__logo-name">WorkTracker</span>
  </div>
  <nav class="sidebar__nav" aria-label="Navegação principal">
    @for (section of menuSections; track section.label) {
      <p class="sidebar__label" [class.sidebar__label--spaced]="section.spaced">{{ section.label }}</p>
      @for (item of section.items; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          ariaCurrentWhenActive="page"
        >
          <app-sidebar-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>
</aside>
<button class="sidebar-backdrop" [class.sidebar-backdrop--visible]="sidebar.mobileOpen()" type="button" aria-label="Close sidebar" (click)="sidebar.closeMobile()"></button>
