<form class="task-status-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error()) {
    <p class="task-status-form__error" role="alert">{{ error() }}</p>
  }

  <label>
    <span class="task-status-form__label">Nome <b>*</b></span>
    <input formControlName="name" type="text" placeholder="Ex.: Em progresso" autocomplete="off" />
  </label>

  <div class="task-status-form__grid">
    <label>
      <span class="task-status-form__label">Cor <b>*</b></span>
      <div class="task-status-form__color-field">
        <input
          type="color"
          aria-label="Escolher cor"
          [value]="form.controls.color.value"
          (input)="setColor($event)"
        />
        <input formControlName="color" type="text" aria-label="Código hexadecimal da cor" />
      </div>
    </label>

    <label>
      Ordem
      <input formControlName="sortOrder" type="number" min="0" />
    </label>
  </div>

  <div class="task-status-form__actions">
    <button type="button" class="task-status-form__secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="task-status-form__primary" [disabled]="saving()">
      {{ saving() ? 'A guardar...' : status() ? 'Guardar alterações' : 'Criar coluna' }}
    </button>
  </div>
</form>
