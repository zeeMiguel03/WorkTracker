<section class="task-column" [style.--task-accent]="accent()">
  <header class="task-column__header">
    <div class="task-column__title">
      <span class="task-column__dot"></span>
      <h2>{{ title() }}</h2>
      <span class="task-column__count">{{ count() }}</span>
    </div>
    <div class="task-column__actions">
      <button type="button" aria-label="Adicionar tarefa">+</button>
      <button type="button" aria-label="Opções da coluna">···</button>
    </div>
  </header>

  @if (tasks().length === 0) {
    <div class="task-column__empty">Sem tarefas nesta coluna</div>
  } @else {
    <div class="task-column__cards">
      @for (task of tasks(); track task.id) {
        <app-task-card [task]="task" />
      }
    </div>
  }
</section>
