<form class="task-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error()) {
    <p class="task-form__error" role="alert">{{ error() | translate }}</p>
  }

  <label>
    <span class="task-form__label">{{ "Título" | translate }} <b>*</b></span>
    <input formControlName="title" type="text" [placeholder]="('Título da tarefa' | translate)" autocomplete="off" />
    @if (hasError('title')) {
      <small>{{ "Introduz um título válido (máximo 150 caracteres)." | translate }}</small>
    }
  </label>

  <label>
     {{ "Descrição" | translate }} <textarea formControlName="description" rows="3" [placeholder]="('Descreve a tarefa' | translate)"></textarea>
  </label>

  <div class="task-form__grid">
    <label>
      <span class="task-form__label">{{ "Estado" | translate }} <b>*</b></span>
      <app-dropdown
        [fullWidth]="true"
        [options]="statusOptions()"
        [value]="form.controls.taskStatusId.value.toString()"
        (valueChange)="chooseStatus($event)"
      />
    </label>

    <label>
       {{ "Fonte" | translate }} <app-dropdown
        [fullWidth]="true"
        [options]="sourceOptions()"
        [value]="form.controls.sourceId.value.toString()"
        (valueChange)="chooseSource($event)"
      />
    </label>

    <label>
      <span class="task-form__label">{{ "Prioridade" | translate }} <b>*</b></span>
      <app-dropdown
        [fullWidth]="true"
        [openUp]="true"
        [options]="priorityOptions"
        [value]="form.controls.priority.value.toString()"
        (valueChange)="choosePriority($event)"
      />
    </label>

    <label>
       {{ "Prazo" | translate }} <input formControlName="dueDate" type="date" />
    </label>
  </div>

  <div class="task-form__actions">
    <button type="button" class="task-form__secondary" (click)="cancelled.emit()">{{ "Cancelar" | translate }}</button>
    <button type="submit" class="task-form__primary" [disabled]="saving()">
      {{ (saving() ? 'A guardar...' : task() ? 'Guardar alterações' : 'Criar tarefa') | translate }}
    </button>
  </div>
</form>
