<form class="task-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error()) {
    <p class="task-form__error" role="alert">{{ error() }}</p>
  }

  <label>
    <span class="task-form__label">Título <b>*</b></span>
    <input formControlName="title" type="text" placeholder="Título da tarefa" autocomplete="off" />
    @if (hasError('title')) {
      <small>Introduz um título válido (máximo 150 caracteres).</small>
    }
  </label>

  <label>
    Descrição
    <textarea formControlName="description" rows="3" placeholder="Descreve a tarefa"></textarea>
  </label>

  <div class="task-form__grid">
    <label>
      <span class="task-form__label">Estado <b>*</b></span>
      <app-dropdown
        [fullWidth]="true"
        [options]="statusOptions()"
        [value]="form.controls.taskStatusId.value.toString()"
        (valueChange)="chooseStatus($event)"
      />
    </label>

    <label>
      Fonte
      <app-dropdown
        [fullWidth]="true"
        [options]="sourceOptions()"
        [value]="form.controls.sourceId.value.toString()"
        (valueChange)="chooseSource($event)"
      />
    </label>

    <label>
      <span class="task-form__label">Prioridade <b>*</b></span>
      <app-dropdown
        [fullWidth]="true"
        [openUp]="true"
        [options]="priorityOptions"
        [value]="form.controls.priority.value.toString()"
        (valueChange)="choosePriority($event)"
      />
    </label>

    <label>
      Prazo
      <input formControlName="dueDate" type="date" />
    </label>
  </div>

  <div class="task-form__actions">
    <button type="button" class="task-form__secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="task-form__primary" [disabled]="saving()">
      {{ saving() ? 'A guardar...' : task() ? 'Guardar alterações' : 'Criar tarefa' }}
    </button>
  </div>
</form>
