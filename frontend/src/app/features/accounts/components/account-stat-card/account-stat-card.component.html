<article class="account-stat-card" [class]="'account-stat-card--' + tone()">
  <div class="account-stat-card__icon" aria-hidden="true">
    @switch (icon()) {
      @case ('accounts') {
        <svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20"/><circle cx="10" cy="7" r="3"/><path d="M16 4.5a3 3 0 0 1 0 5.8M20 20v-1.5a4.5 4.5 0 0 0-3-4.24"/></svg>
      }
      @case ('income') {
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      }
      @case ('expense') {
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      }
      @default {
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h3"/></svg>
      }
    }
  </div>
  <div class="account-stat-card__content">
    <p>{{ label() }}</p>
    <strong>{{ value() }}</strong>
    @if (detail(); as statDetail) {
      <span>{{ statDetail }}</span>
    }
  </div>
</article>
