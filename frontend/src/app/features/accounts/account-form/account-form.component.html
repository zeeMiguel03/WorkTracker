<form class="account-form" (ngSubmit)="submit()">
  <div class="account-form__field">
    <label for="account-name">Nome da conta</label>
    <input id="account-name" name="name" type="text" placeholder="Ex.: Revolut" [(ngModel)]="draft.name" required />
  </div>

  <div class="account-form__field">
    <label for="account-type">Tipo de conta</label>
    <app-dropdown
      [fullWidth]="true"
      [options]="accountTypes"
      [value]="draft.type"
      (valueChange)="selectType($event)"
    />
  </div>

  <div class="account-form__row">
    <div class="account-form__field">
      <label for="account-balance">Saldo inicial</label>
      <div class="account-form__input-prefix">
        <span>€</span>
        <input id="account-balance" name="balance" type="number" min="0" step="0.01" [(ngModel)]="draft.balance" />
      </div>
    </div>

    <div class="account-form__field">
      <label for="account-currency">Moeda</label>
      <div id="account-currency" class="account-form__fixed-field">EUR — Euro</div>
    </div>
  </div>

  <fieldset class="account-form__colors">
    <legend>Cor da conta</legend>
    <div class="account-form__color-list">
      @for (color of colors; track color) {
        <button
          type="button"
          class="account-form__color"
          [class.account-form__color--selected]="draft.color === color"
          [style.--account-color]="color"
          [attr.aria-label]="'Escolher cor ' + color"
          (click)="selectColor(color)"
        ></button>
      }
    </div>
  </fieldset>

  <label class="account-form__toggle">
    <input name="includeInTotal" type="checkbox" [(ngModel)]="draft.includeInTotal" />
    <span class="account-form__switch" aria-hidden="true"></span>
    <span>
      <strong>Incluir no saldo total</strong>
      <small>Esta conta será considerada no resumo geral.</small>
    </span>
  </label>

  <div class="account-form__actions">
    <button class="account-form__cancel" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="account-form__submit" type="submit">{{ account() ? 'Guardar alterações' : 'Adicionar conta' }}</button>
  </div>
</form>
