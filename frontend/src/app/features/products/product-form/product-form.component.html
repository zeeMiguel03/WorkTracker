<form class="product-form" (ngSubmit)="submit()">
  <div class="product-form__intro">
    <span class="product-form__intro-icon">+</span>
    <div>
      <strong>Dados principais</strong>
      <p>Preenche apenas o essencial. Podes completar depois.</p>
    </div>
  </div>

  <div class="product-form__field product-form__field--wide product-form__field--images">
    <label for="product-images">Fotografias <small>opcional · até 5 imagens</small></label>
    <div class="product-form__media-grid">
      @for (file of selectedFiles; track file) {
        <div
          class="product-form__preview"
          [class.product-form__preview--dragging]="draggedImageIndex === $index"
          [class.product-form__preview--drag-over]="dragOverImageIndex === $index && draggedImageIndex !== $index"
          draggable="true"
          (dragstart)="onImageDragStart($index, $event)"
          (dragover)="onImageDragOver($index, $event)"
          (drop)="onImageDrop($index, $event)"
          (dragend)="onImageDragEnd()"
        >
          <img [src]="filePreview(file)" [alt]="file.name" />
          @if ($index === 0) { <span class="product-form__cover-label">Principal</span> }
          <button class="product-form__remove-image" type="button" [attr.aria-label]="'Remover ' + file.name" (click)="removeFile($index)">×</button>
        </div>
      }
      @if (selectedFiles.length < 5) {
        <label class="product-form__add-image" for="product-images">
          <span class="product-form__add-image-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 7.5h3l1.4-2h3.2l1.4 2H20a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1Z" />
              <circle cx="12" cy="13" r="3.2" />
            </svg>
          </span>
          <strong>Adicionar fotografia</strong>
          <small>JPG, PNG ou WebP</small>
          <input id="product-images" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple (change)="onFilesSelected($event)" />
        </label>
      }
    </div>
  </div>

  <div class="product-form__field product-form__field--wide">
    <label for="product-name">Nome do produto <span>*</span></label>
    <input id="product-name" name="name" type="text" placeholder="Ex.: Casaco Ralph Lauren azul" [(ngModel)]="draft.name" required />
  </div>

  <div class="product-form__grid">
    <div class="product-form__field">
      <label for="product-category">Categoria</label>
      <input id="product-category" name="category" type="text" placeholder="Ex.: Casacos" [(ngModel)]="draft.category" />
    </div>
    <div class="product-form__field">
      <label for="product-brand">Marca</label>
      <input id="product-brand" name="brand" type="text" placeholder="Ex.: Ralph Lauren" [(ngModel)]="draft.brand" />
    </div>
    <div class="product-form__field">
      <label for="product-size">Tamanho</label>
      <input id="product-size" name="size" type="text" placeholder="Ex.: M" [(ngModel)]="draft.size" />
    </div>
    <div class="product-form__field">
      <label for="product-color">Cor</label>
      <input id="product-color" name="color" type="text" placeholder="Ex.: Azul" [(ngModel)]="draft.color" />
    </div>
  </div>

  <div class="product-form__grid product-form__grid--prices">
    <div class="product-form__field">
      <label for="product-condition">Estado</label>
      <app-dropdown
        [fullWidth]="true"
        [options]="conditions"
        [value]="draft.condition"
        (valueChange)="chooseCondition($event)"
      />
    </div>
    <div class="product-form__field">
      <label for="product-purchase-price">Preço de compra</label>
      <div class="product-form__money-input"><span>€</span><input id="product-purchase-price" name="purchasePrice" type="number" min="0" step="0.01" [(ngModel)]="draft.purchasePrice" /></div>
    </div>
    <div class="product-form__field">
      <label for="product-listing-price">Preço de venda</label>
      <div class="product-form__money-input"><span>€</span><input id="product-listing-price" name="listingPrice" type="number" min="0" step="0.01" placeholder="Opcional" [(ngModel)]="draft.listingPrice" /></div>
    </div>
  </div>

  <div class="product-form__actions">
    <button class="product-form__cancel" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="product-form__submit" type="submit">Adicionar produto</button>
  </div>
</form>
