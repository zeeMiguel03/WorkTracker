<form class="entry-form" (ngSubmit)="submit()">
  <div class="entry-form__field">
    <label for="entry-name">Descrição</label>
    <input id="entry-name" name="name" type="text" placeholder="Ex.: Salário, venda de ténis..." [(ngModel)]="draft.name" required />
  </div>

  <div class="entry-form__image-field">
    <label>Imagem <small>(opcional)</small></label>
    <app-file-picker
      inputId="entry-image"
      inputName="image"
      accept="image/png,image/jpeg,image/webp"
      placeholder="Nenhuma imagem selecionada"
      (fileSelected)="selectImage($event)"
    />
    @if (imagePreviewUrl) {
      <img class="entry-form__image-preview" [src]="imagePreviewUrl" alt="Pré-visualização do artigo" />
    }
  </div>

  <fieldset class="entry-form__operation">
    <legend>Tipo de operação</legend>
    <div class="entry-form__operation-options">
      @for (mode of operationModes; track mode.value) {
        <button
          class="entry-form__operation-option"
          type="button"
          [class.entry-form__operation-option--active]="draft.operationMode === mode.value"
          (click)="selectOperationMode(mode.value)"
        >
          <span>{{ mode.label }}</span>
          <small>{{ mode.description }}</small>
        </button>
      }
    </div>
  </fieldset>

  <div class="entry-form__row">
    <div class="entry-form__field">
      <label>Conta</label>
      <app-dropdown
        [fullWidth]="true"
        [options]="accountOptions()"
        [value]="draft.account"
        (valueChange)="selectAccount($event)"
      />
    </div>

    <div class="entry-form__field">
      <label>Fonte</label>
      <app-dropdown
        [fullWidth]="true"
        [options]="sourceOptions()"
        [value]="draft.source"
        (valueChange)="selectSource($event)"
      />
    </div>
  </div>

  <div class="entry-form__row">
    <div class="entry-form__field">
      <label>Tipo de transação</label>
      <app-dropdown
        [fullWidth]="true"
        [options]="transactionTypeOptions()"
        [value]="draft.transactionType"
        (valueChange)="selectTransactionType($event)"
      />
    </div>

    <div class="entry-form__field">
      <label>Movimento</label>
      <app-dropdown
        [fullWidth]="true"
        [options]="flowOptions"
        [value]="draft.flow"
        (valueChange)="selectFlow($event)"
      />
    </div>
  </div>

  <div class="entry-form__row">
    <div class="entry-form__field">
      <label for="entry-date">Data</label>
      <input id="entry-date" name="date" type="date" [(ngModel)]="draft.date" required />
    </div>

    <div class="entry-form__field">
      <label for="entry-quantity">Quantidade</label>
      <input id="entry-quantity" name="quantity" type="number" min="0.01" step="0.01" [(ngModel)]="draft.quantity" required />
    </div>
  </div>

  <div class="entry-form__field">
    <label for="entry-value">Valor</label>
    <div class="entry-form__input-prefix">
      <span>€</span>
      <input id="entry-value" name="value" type="number" min="0" step="0.01" [(ngModel)]="draft.value" required />
    </div>
  </div>

  @if (draft.operationMode === 'recurring') {
    <section class="entry-form__recurring" aria-labelledby="recurring-title">
      <div class="entry-form__recurring-heading">
        <div>
          <h3 id="recurring-title">Configuração recorrente</h3>
          <p>Este movimento será repetido automaticamente.</p>
        </div>
        <span class="entry-form__recurring-badge">Recorrente</span>
      </div>

      <div class="entry-form__row">
        <div class="entry-form__field">
          <label>Frequência</label>
          <app-dropdown
            [fullWidth]="true"
            [options]="frequencyOptions"
            [value]="draft.frequency"
            (valueChange)="selectFrequency($event)"
          />
        </div>
      </div>

      <div class="entry-form__row">
        <div class="entry-form__field">
          <label>Fim da recorrência</label>
          <app-dropdown
            [fullWidth]="true"
            [options]="endModeOptions"
            [value]="draft.endMode"
            (valueChange)="selectEndMode($event)"
          />
        </div>

        @if (draft.endMode === 'date') {
          <div class="entry-form__field">
            <label for="entry-end-date">Data final</label>
            <input id="entry-end-date" name="endDate" type="date" [(ngModel)]="draft.endDate" required />
          </div>
        } @else {
          <div class="entry-form__recurring-note">Sem data de fim definida</div>
        }
      </div>
    </section>
  }

  <div class="entry-form__field">
    <label for="entry-description">Descrição <small>(opcional)</small></label>
    <textarea id="entry-description" name="description" rows="3" placeholder="Adiciona uma nota sobre este movimento" [(ngModel)]="draft.description"></textarea>
  </div>

  <div class="entry-form__actions">
    <button class="entry-form__cancel" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="entry-form__submit" type="submit">Guardar movimento</button>
  </div>
</form>
