<form class="source-form" (submit)="submit($event)">
  <label>
    <span class="source-form__label-text">{{ "Nome da fonte" | translate }} <b>*</b></span>
    <input
      name="sourceName"
      type="text"
      [value]="source()?.name ?? ''"
      [placeholder]="('Ex.: Vinted' | translate)"
      autocomplete="off"
      required
    />
  </label>

  <label>
    <span class="source-form__label-text">{{ "Link da fonte" | translate }} <small>{{ "(opcional)" | translate }}</small></span>
    <input
      name="sourceLink"
      type="url"
      [value]="source()?.websiteUrl ?? ''"
      [placeholder]="('https://exemplo.com' | translate)"
      autocomplete="url"
      inputmode="url"
    />
  </label>

  <label>
    <span class="source-form__label-text">{{ "Imagem da fonte" | translate }}</span>
    <app-file-picker
      inputId="source-image"
      inputName="sourceImage"
      accept="image/png,image/jpeg,image/webp"
      [placeholder]="('Nenhuma imagem selecionada' | translate)"
      (fileSelected)="handleImageSelected($event)"
    />
  </label>

  <label class="source-form__switch-row">
    <span>
      <strong>{{ "Fonte ativa" | translate }}</strong>
      <small>{{ "As fontes inativas deixam de aparecer nas novas seleções." | translate }}</small>
    </span>
    <span class="source-form__switch" aria-hidden="true">
      <input
        name="sourceActive"
        type="checkbox"
        [checked]="source()?.isActive ?? true"
        [attr.aria-label]="('Fonte ativa' | translate)"
      />
      <span class="source-form__switch-track"></span>
    </span>
  </label>

  @if (error()) {
    <p class="source-form__error" role="alert">{{ error() | translate }}</p>
  }

  <div class="source-form__actions">
    <button
      class="source-form__secondary"
      type="button"
      [disabled]="saving()"
      (click)="cancelled.emit()"
    >
       {{ "Cancelar" | translate }} </button>
    <button
      class="source-form__primary"
      type="submit"
      [disabled]="saving()"
    >
      {{ (saving() ? 'A guardar...' : (source() ? 'Guardar alterações' : 'Criar fonte')) | translate }}
    </button>
  </div>
</form>
