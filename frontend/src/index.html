<!doctype html>
<html lang="pt" class="dark" data-color-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <title>WorkTracker | Organiza o teu trabalho</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/images/logo/worktracker-icon.svg" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('worktracker-theme') === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.colorScheme = theme;
        } catch {
          // Keep the default dark theme when storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
